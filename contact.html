<section class="pt-32 container mx-auto px-6 grid md:grid-cols-2 gap-12">
    <div>
        <h2 class="text-5xl font-black mb-6">pull up.</h2>
        <p class="opacity-70 mb-8">al khan, sharjah, uae. open until 1am (2am on weekends).</p>
        <div class="w-full h-64 bg-zinc-900 rounded-lg overflow-hidden">
            <iframe src="https://www.google.com/maps/embed?pb=YOUR_EMBED_LINK" class="w-full h-full grayscale invert"></iframe>
        </div>
    </div>

    <div class="bg-zinc-900 p-8 rounded-2xl">
        <h3 class="text-2xl font-bold mb-6">shoot a message.</h3>
        <form action="https://formspree.io/f/YOUR_RESTAURANT_ID" method="POST" class="space-y-4">
            <input type="text" name="name" placeholder="name" class="w-full bg-black border border-white/10 p-4 rounded-lg">
            <input type="email" name="email" placeholder="email" class="w-full bg-black border border-white/10 p-4 rounded-lg">
            <textarea name="message" placeholder="how can we help?" class="w-full bg-black border border-white/10 p-4 rounded-lg h-32"></textarea>
            <button type="submit" class="w-full bg-white text-black py-4 font-black rounded-lg hover:bg-orange-600 hover:text-white transition">send it</button>
        </form>
    </div>
</section>
